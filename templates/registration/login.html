<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login &mdash; Mess Manager</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
    }

    .login-wrapper {
      width: 100%;
      max-width: 380px;
    }

    .login-card {
      padding: 32px 28px;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 20px 60px rgb(0 0 0 / 20%);
    }

    .brand {
      margin-bottom: 28px;
      text-align: center;
    }

    .brand-logo {
      display: grid;
      width: 56px;
      height: 56px;
      margin: 0 auto 14px;
      place-items: center;
      border-radius: 50%;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      color: #fff;
      font-size: 26px;
      font-weight: 700;
    }

    .brand-title {
      margin-bottom: 4px;
      color: #1f2937;
      font-size: 22px;
    }

    .brand-subtitle {
      color: #6b7280;
      font-size: 13px;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-group {
      position: relative;
    }

    .form-group input {
      width: 100%;
      height: 54px;
      padding: 18px 15px 6px;
      border: 1px solid #747775;
      border-radius: 4px;
      outline: none;
      background: transparent;
      color: #1f1f1f;
      font: 16px Arial, sans-serif;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus {
      border-color: #0b57d0;
      box-shadow: inset 0 0 0 1px #0b57d0;
    }

    .form-group label {
      position: absolute;
      top: 50%;
      left: 15px;
      padding: 0 4px;
      transform: translateY(-50%);
      background: #fff;
      color: #444746;
      font-size: 16px;
      pointer-events: none;
      transition: 0.2s ease;
    }

    .form-group input:focus + label,
    .form-group input:not(:placeholder-shown) + label {
      top: 0;
      color: #0b57d0;
      font-size: 12px;
      font-weight: 500;
    }

    .password-input {
      padding-right: 44px !important;
    }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 12px;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: #444746;
      cursor: pointer;
    }

    .form-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .checkbox-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #6b7280;
      cursor: pointer;
    }

    .checkbox-wrap input {
      accent-color: #0b57d0;
    }

    .alert-error {
      padding: 10px 12px;
      border: 1px solid #fca5a5;
      border-radius: 6px;
      background: #fef2f2;
      color: #b91c1c;
      font-size: 13px;
    }

    .btn-login {
      height: 44px;
      margin-top: 6px;
      border: 0;
      border-radius: 6px;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
    }

    .btn-login:hover {
      opacity: 0.92;
    }

    .form-footer {
      margin-top: 8px;
      color: #6b7280;
      font-size: 13px;
      text-align: center;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 24px 20px;
      }

      .brand-title {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <main class="login-wrapper">
    <section class="login-card">
      <header class="brand">
        <div class="brand-logo">M</div>
        <h1 class="brand-title">Mess Manager</h1>
        <p class="brand-subtitle">Sign in to continue</p>
      </header>

      {% if form.errors %}
        <div class="alert-error" style="margin-bottom: 16px;">
          Invalid username or password. Please try again.
        </div>
      {% endif %}

      <form class="login-form" method="post" action="">
        {% csrf_token %}

        <div class="form-group">
          <input
            type="text"
            id="id_username"
            name="username"
            placeholder=" "
            autocomplete="username"
            required
            autofocus>
          <label for="id_username">Username</label>
        </div>

        <div class="form-group">
          <input
            class="password-input"
            type="password"
            id="id_password"
            name="password"
            placeholder=" "
            autocomplete="current-password"
            required>
          <label for="id_password">Password</label>
          <button
            class="toggle-password"
            type="button"
            aria-label="Show password"
            onclick="togglePassword()">
            &#128065;
          </button>
        </div>

        <button type="submit" class="btn-login">SIGN IN</button>

        <p class="form-footer">
          Meal count &middot; Bazaar hisab &middot; Bill split
        </p>
      </form>
    </section>
  </main>

  <script>
    function togglePassword() {
      const input = document.getElementById("id_password");
      const button = document.querySelector(".toggle-password");
      const showing = input.type === "password";

      input.type = showing ? "text" : "password";
      button.setAttribute("aria-label", showing ? "Hide password" : "Show password");
    }
  </script>
</body>
</html>
